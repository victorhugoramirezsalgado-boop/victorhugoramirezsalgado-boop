name: Python Issue Audit

on:
  issues:
    types: [opened, edited, reopened, labeled]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  python-audit:
    name: Auditoría Python - Issue Terminal
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Información del issue
        if: github.event_name == 'issues'
        shell: bash
        run: |
          echo "================================================"
          echo "Issue: #${{ github.event.issue.number }}"
          echo "Título: ${{ github.event.issue.title }}"
          echo "Estado: ${{ github.event.issue.state }}"
          echo "Repositorio: ${{ github.repository }}"
          echo "================================================"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar versión Python y pip
        shell: bash
        run: |
          echo "================================================"
          echo "Verificando entorno Python..."
          echo "================================================"
          python --version
          pip --version
          python -m venv --help >/dev/null && echo "✓ venv disponible" || echo "✗ venv no disponible"

      - name: Ejecutar script de auditoría del sistema
        shell: bash
        run: |
          chmod +x .github/scripts/fix-system.sh
          ./.github/scripts/fix-system.sh

      - name: Instalar dependencias
        shell: bash
        run: |
          echo ""
          echo "================================================"
          echo "Instalando dependencias Python..."
          echo "================================================"
          if [ -f requirements.txt ]; then
            echo "✓ requirements.txt encontrado"
            pip install -r requirements.txt
            echo "✓ Dependencias instaladas"
          else
            echo "⚠ requirements.txt no encontrado"
          fi

      - name: Validar integridad del proyecto Python
        shell: bash
        run: |
          echo ""
          echo "================================================"
          echo "Validando integridad del proyecto..."
          echo "================================================"
          
          # Verificar conflictos de dependencias
          if [ -f requirements.txt ]; then
            echo "Validando dependencias..."
            python -m pip check || echo "⚠ Algunas dependencias tienen conflictos"
          fi
          
          # Django check
          if [ -f "manage.py" ]; then
            echo "✓ Proyecto Django detectado"
            python manage.py check
            echo "✓ Django check pasó"
          fi
          
          # Flask check
          if [ -f "app.py" ] || [ -f "wsgi.py" ]; then
            echo "✓ Proyecto Flask/WSGI detectado"
          fi
          
          # FastAPI check
          if grep -q "fastapi" requirements.txt 2>/dev/null; then
            echo "✓ Proyecto FastAPI detectado"
          fi
          
          # Validar sintaxis de todos los archivos Python
          echo ""
          echo "Validando sintaxis de archivos Python..."
          python -m compileall . -q || echo "⚠ Algunos archivos tienen errores de sintaxis"
          echo "✓ Compilación de Python completada"

      - name: Ejecutar tests si existen
        shell: bash
        continue-on-error: true
        run: |
          echo ""
          echo "================================================"
          echo "Ejecutando tests..."
          echo "================================================"
          
          if [ -f "pytest.ini" ] || [ -d "tests" ]; then
            echo "✓ Tests detectados con pytest"
            if command -v pytest &>/dev/null || python -m pytest --version &>/dev/null; then
              python -m pytest -v --tb=short 2>/dev/null || echo "⚠ Algunos tests fallaron"
            fi
          elif [ -f "setup.py" ]; then
            echo "✓ setup.py encontrado"
            python setup.py test 2>/dev/null || echo "⚠ No hay tests configurados"
          else
            echo "ℹ No hay tests configurados"
          fi

      - name: Resumen final
        shell: bash
        if: always()
        run: |
          echo ""
          echo "================================================"
          echo "RESUMEN FINAL DE AUDITORÍA"
          echo "================================================"
          echo "✓ Entorno Python verificado"
          echo "✓ Dependencias instaladas y validadas"
          echo "✓ Sintaxis de código validada"
          echo "✓ Sistema listo para ejecutar"
          echo "================================================"
